name: Terraform Resource Manager Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Package Terraform stack
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build package
        run: python3 scripts/package_terraform_stack.py

      - name: Create checksum
        run: sha256sum dist/no.1-agent-workbench-terraform-stack.zip > dist/no.1-agent-workbench-terraform-stack.zip.sha256

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/no.1-agent-workbench-terraform-stack.zip
            dist/no.1-agent-workbench-terraform-stack.zip.sha256
